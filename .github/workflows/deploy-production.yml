name: Deploy production

# Production is manual on purpose (docs/deployments.md). This workflow has no
# push, pull_request or schedule trigger, so no merge can reach it; a human
# dispatches it, types the target's Worker name, and a required reviewer on the
# protected `production` environment approves it.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: true
        type: choice
        options:
          - app
          - site
      confirm:
        description: Type the Worker name to confirm (certpath-pilot or certpath-site)
        required: true
        type: string

permissions:
  contents: read

# One production deploy per target at a time. A second dispatch waits rather
# than racing, and an in-flight deploy is never cancelled.
concurrency:
  group: deploy-production-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  # Production deploys go through the same single gate as every other change.
  # It runs before the protected environment is entered, so the reviewer
  # approves a commit that already passed.
  verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: echo "CERTPATH_NODE22_PATH=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm run verify

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Protected environment: required reviewers and any deployment-branch
    # restriction live here, in repository settings (docs/deployments.md).
    environment: production
    env:
      EXPECTED_ACCOUNT_ID: ef67137c4d1556f7f51f1cb3f1f420f3
      PRODUCTION_DATABASE: certpath-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - name: Confirm the target
        env:
          TARGET: ${{ inputs.target }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            site) worker=certpath-site ;;
            app) worker=certpath-pilot ;;
            *)
              echo "::error title=Unknown target::${TARGET} is not a target this workflow deploys"
              exit 1
              ;;
          esac
          if [ "$CONFIRM" != "$worker" ]; then
            echo "::error title=Confirmation does not name the target::Type the target's Worker name (${worker}) into the confirm input; got ${CONFIRM:-nothing}."
            exit 1
          fi
          echo "WORKER=$worker" >> "$GITHUB_ENV"
      - name: Record the deployed commit
        run: echo "DEPLOYED_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          failed=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN is missing::Create the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit for the Certpath account). See docs/deployments.md."
            failed=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=CLOUDFLARE_ACCOUNT_ID is missing::Create the repository secret CLOUDFLARE_ACCOUNT_ID with the Certpath account id ${EXPECTED_ACCOUNT_ID}. See docs/deployments.md."
            failed=1
          elif [ "$CLOUDFLARE_ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error title=CLOUDFLARE_ACCOUNT_ID is not the Certpath account::The secret holds an account id that is not ${EXPECTED_ACCOUNT_ID}; this workflow only deploys to the Certpath account."
            failed=1
          fi
          exit "$failed"
      # Same schema gate as staging, with the opposite outcome: a human is
      # watching, so a pending migration aborts the dispatch (exit 4) instead of
      # skipping it. Nothing is ever applied from here.
      - name: Migration gate
        if: inputs.target == 'app'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node apps/web/scripts/migration-gate.mjs \
            --config wrangler.pilot.jsonc \
            --database "$PRODUCTION_DATABASE" \
            --mode abort \
            --expect-account "$EXPECTED_ACCOUNT_ID"
      # The public site carries no D1 binding, so there is no schema to gate;
      # the step above is the only difference between the two targets.
      - name: Build certpath-site
        if: inputs.target == 'site'
        run: npm run build:site
      - name: Build certpath-pilot
        if: inputs.target == 'app'
        run: npm run build:pilot
      - name: Stamp DEPLOYED_COMMIT into the deploy artefact
        run: node apps/web/scripts/stamp-deployed-commit.mjs apps/web/build/server/wrangler.json
      - name: Deploy certpath-site
        if: inputs.target == 'site'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:site
      # The pilot path carries the same account assertion as staging: the script
      # refuses to deploy without --expect-account and refuses an environment
      # that disagrees, so the pin is not only the workflow's environment check.
      # The root script is an `npm run --workspace` hop, and npm would swallow
      # the flag on the way through; naming the workspace forwards it.
      - name: Deploy certpath-pilot
        if: inputs.target == 'app'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:pilot --workspace @certpath/web -- --expect-account "$EXPECTED_ACCOUNT_ID"
      - name: Deployment status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "DEPLOYED_COMMIT=${DEPLOYED_COMMIT}"
          cd apps/web
          if [ "${{ inputs.target }}" = "site" ]; then
            node ../../node_modules/wrangler/bin/wrangler.js deployments status -c wrangler.site.jsonc
          else
            node ../../node_modules/wrangler/bin/wrangler.js deployments status -c wrangler.pilot.jsonc
          fi
      - name: Record the deployment
        if: always()
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "- target: \`${WORKER:-unknown}\`"
            echo "- commit: \`${DEPLOYED_COMMIT:-unknown}\`"
            echo "- status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
